name: "CI - Test Templates"
on:
  pull_request:
    paths-ignore:
      - '*.md'
      - LICENSE
      - .gitkeep
      - .gitignore
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - LICENSE
      - .gitkeep
      - .gitignore
  workflow_dispatch:
    inputs:
      feature-ref:
        description: 'Test against this git ref of localstack/devcontainer-feature instead of the published Feature'
        required: false
        default: ''

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # Pull requests test the templates they touch. Pushes to main and manual runs test all of them.
      templates: ${{ github.event_name == 'pull_request' && steps.filter.outputs.changes || '["localstack-dind","localstack-dood"]' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            localstack-dind:
              - 'src/localstack-dind/**'
              - 'test/localstack-dind/**'
              - 'test/test-utils/**'
              - '.github/**'
            localstack-dood:
              - 'src/localstack-dood/**'
              - 'test/localstack-dood/**'
              - 'test/test-utils/**'
              - '.github/**'

  smoke-test:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.templates != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        templates: ${{ fromJSON(needs.detect-changes.outputs.templates) }}
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test for '${{ matrix.templates }}'
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        uses: ./.github/actions/smoke-test
        with:
          template: "${{ matrix.templates }}"
          feature-ref: ${{ inputs.feature-ref }}

  scenario-test:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.templates != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        templates: ${{ fromJSON(needs.detect-changes.outputs.templates) }}
    steps:
      - uses: actions/checkout@v4

      - name: Scenario test(s) for '${{ matrix.templates }}'
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        uses: ./.github/actions/scenario-test
        with:
          template: "${{ matrix.templates }}"
          feature-ref: ${{ inputs.feature-ref }}
