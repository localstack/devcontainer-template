services:
  localstack:
    container_name: localstack-main
    image: localstack/localstack-pro:${templateOption:version}
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # External services port range
      - "127.0.0.1:443:443"              # LocalStack HTTPS Gateway
    env_file:
      - .env
    environment:
      # Read from the host environment, never written into the template.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      # Containers that LocalStack starts, such as Lambda functions, join the shared network.
      LAMBDA_DOCKER_NETWORK: ${templateOption:networkName}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${templateOption:volumePath}:/var/lib/localstack"
    networks:
      ls:
        ipv4_address: ${templateOption:ipAddress}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
    init: true
    environment:
      # Used by lstk for Cloud Pods and other platform commands.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      # lstk talks to the localstack service instead of starting its own container.
      LSTK_ENDPOINT_URL: http://${templateOption:host}
      LOCALSTACK_HOST: ${templateOption:host}
      # `aws` and the AWS SDKs use the `localstack` profile written by `lstk setup aws`.
      AWS_PROFILE: localstack
      AWS_REGION: ${templateOption:defaultRegion}
      AWS_DEFAULT_REGION: ${templateOption:defaultRegion}
    dns:
      # LocalStack's DNS server resolves localhost.localstack.cloud to the localstack service.
      - ${templateOption:ipAddress}
    depends_on:
      - localstack
    networks:
      - ls

networks:
  ls:
    name: ${templateOption:networkName}
    ipam:
      config:
        - subnet: ${templateOption:networkCidr}
